<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Peeking inside a robot policy</title>
  <desc id="desc">A minimalist diagram showing inputs passing through pi zero FAST and becoming robot action tokens.</desc>
  <rect width="1200" height="630" fill="#111111"/>
  <text x="80" y="105" fill="#777777" font-family="Arial,sans-serif" font-size="21">VLA INTERPRETABILITY</text>
  <text x="80" y="190" fill="#eeeeee" font-family="Arial,sans-serif" font-size="61" font-weight="600">Peeking inside</text>
  <text x="80" y="260" fill="#eeeeee" font-family="Arial,sans-serif" font-size="61" font-weight="600">a robot policy</text>
  <path d="M80 280C220 268 365 287 516 273" fill="none" stroke="#fd73a9" stroke-width="8" stroke-linecap="round"/>
  <text x="82" y="332" fill="#888888" font-family="Arial,sans-serif" font-size="23">saving what π0-FAST saw, focused on,</text>
  <text x="82" y="364" fill="#888888" font-family="Arial,sans-serif" font-size="23">and considered before the robot moved</text>
  <g transform="translate(78 442)" font-family="Arial,sans-serif">
    <g>
      <rect width="118" height="88" rx="7" fill="none" stroke="#555555"/>
      <rect x="15" y="17" width="25" height="25" rx="3" fill="none" stroke="#aaaaaa"/>
      <rect x="47" y="17" width="25" height="25" rx="3" fill="none" stroke="#aaaaaa"/>
      <rect x="79" y="17" width="25" height="25" rx="3" fill="none" stroke="#666666"/>
      <rect x="15" y="54" width="89" height="14" rx="3" fill="#33242b"/>
      <text x="59" y="105" text-anchor="middle" fill="#777777" font-size="15">inputs</text>
    </g>
    <path d="M138 44h64m-12-9 12 9-12 9" fill="none" stroke="#777777" stroke-width="2"/>
    <g transform="translate(222)">
      <rect width="152" height="88" rx="7" fill="none" stroke="#eeeeee"/>
      <text x="76" y="35" text-anchor="middle" fill="#eeeeee" font-family="monospace" font-size="20">π0-FAST</text>
      <path d="M24 49h104M24 56h104M24 63h104M24 70h104" stroke="#555555"/>
      <circle cx="45" cy="56" r="4" fill="#fd73a9"/><circle cx="95" cy="63" r="4" fill="#fd73a9"/>
      <text x="76" y="105" text-anchor="middle" fill="#777777" font-size="15">18 layers + hooks</text>
    </g>
    <path d="M394 44h64m-12-9 12 9-12 9" fill="none" stroke="#777777" stroke-width="2"/>
    <g transform="translate(478)">
      <rect width="118" height="88" rx="7" fill="none" stroke="#555555"/>
      <rect x="17" y="35" width="13" height="13" rx="2" fill="none" stroke="#aaaaaa"/>
      <rect x="36" y="35" width="13" height="13" rx="2" fill="#33242b" stroke="#fd73a9"/>
      <rect x="55" y="35" width="13" height="13" rx="2" fill="none" stroke="#aaaaaa"/>
      <rect x="74" y="35" width="13" height="13" rx="2" fill="#33242b" stroke="#fd73a9"/>
      <rect x="93" y="35" width="13" height="13" rx="2" fill="none" stroke="#aaaaaa"/>
      <text x="59" y="105" text-anchor="middle" fill="#777777" font-size="15">action tokens</text>
    </g>
  </g>
  <text x="1120" y="574" text-anchor="end" fill="#555555" font-family="Arial,sans-serif" font-size="17">ANN SONG</text>
</svg>

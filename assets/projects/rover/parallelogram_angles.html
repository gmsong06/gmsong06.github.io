<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rover arm: parallelogram transmission</title>
<script>
  // Follow the site theme (same origin, so localStorage is shared).
  try {
    document.documentElement.setAttribute(
      'data-theme',
      localStorage.getItem('theme') || 'dark'
    );
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>

<style>
  :root {
    --text: #111;
    --muted: #666;
    --border: #ddd;
    --accent: #fd73a9;
    --upper: #3f6fd8;
    --crank: #c8791f;
    --forearm: #d94b87;
  }

  [data-theme='dark'] {
    --text: #ccc;
    --muted: #777;
    --border: #2e2e2e;
    --accent: #fd73a9;
    --upper: #7ea6f2;
    --crank: #e0a35c;
    --forearm: #fd73a9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: transparent;
    color: var(--text);
    font-family:
      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  main {
    max-width: 980px;
    margin: auto;
    padding: 0;
  }

  h1 {
    font-size: 17px;
    margin: 0 0 8px;
  }

  p { margin: 0 0 12px; }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 16px 0 12px;
  }

  label { display: block; }

  input[type='range'] {
    display: block;
    width: 100%;
    margin: 10px 0;
    accent-color: var(--accent);
  }

  output { font-variant-numeric: tabular-nums; }

  button {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }

  button:hover { border-color: var(--accent); }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin: 14px 0;
    color: var(--muted);
    font-size: 13px;
  }

  .swatch {
    display: inline-block;
    width: 22px;
    height: 5px;
    vertical-align: middle;
    margin-right: 6px;
    border-radius: 3px;
  }

  svg {
    width: 100%;
    height: 430px;
    display: block;
  }

  svg text {
    fill: var(--muted);
    font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  td, th {
    padding: 8px 7px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  td:last-child {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  th {
    font-weight: 600;
    color: var(--muted);
  }

  .equations {
    padding: 12px 0;
    font-size: 14px;
    line-height: 1.9;
  }

  .note {
    color: var(--muted);
    font-size: 13px;
  }

  .reading { font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; }

  @media (max-width: 560px) {
    .controls { grid-template-columns: 1fr; gap: 8px; }
    svg { height: 370px; }
    table { font-size: 12px; }
  }
</style>
</head>
<body>
<main>
<div class="controls">
<div><label for="shoulder">Shoulder motor θₛ: <output id="shoulder-value">90°</output></label><input id="shoulder" type="range" min="45" max="100" step="1" value="90"></div>
<div><label for="elbow">Corrected elbow motor θₑ: <output id="elbow-value">−90°</output></label><input id="elbow" type="range" min="-120" max="-60" step="1" value="-90"></div>
</div>
<button id="home" type="button">Startup Pose</button>
<div class="legend"><span><i class="swatch" style="background:var(--upper)"></i>AD: upper arm, 0.47 m</span><span><i class="swatch" style="background:var(--crank)"></i>AB and DC: cranks, 0.08 m</span><span><i class="swatch" style="background:var(--forearm)"></i>Forearm, 0.46 m</span><span>BC: rod, 0.47 m</span></div>
<svg id="arm" role="img" aria-labelledby="arm-title arm-desc"></svg>
<div id="equations" class="equations reading" aria-live="polite"></div>
<div class="table-wrap"></div></main>
<script>
'use strict';
const A_OFFSET = 270;
const K = -180;
const C_OFFSET = A_OFFSET + K;
const L1 = 0.47, L2 = 0.46, CRANK = 0.08;
const ZERO_OFFSET = -1.11;
const byId = id => document.getElementById(id);
const shoulderInput = byId('shoulder');
const elbowInput = byId('elbow');
const svg = byId('arm');
const vector = (length, degrees) => {
  const angle = degrees * Math.PI / 180;
  return [length * Math.cos(angle), length * Math.sin(angle)];
};
const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
const format = (v, digits = 0) => `${v < 0 ? '−' : ''}${Math.abs(v).toFixed(digits)}°`;
function state() {
  const shoulder = Number(shoulderInput.value);
  const elbow = Number(elbowInput.value);
  const alpha = elbow + A_OFFSET;
  const beta = alpha + K;
  const qe = beta - shoulder;
  const raw = ZERO_OFFSET - elbow;
  const A = [0, 0];
  const B = vector(CRANK, alpha);
  const D = vector(L1, shoulder);
  // Closure: AB = DC and AD = BC as vectors.
  const C = add(D, B);
  const W = add(D, vector(L2, beta));
  return {shoulder, elbow, alpha, beta, qe, raw, A, B, C, D, W};
}
function draw(s) {
  const width = svg.clientWidth;
  if (!width) return;
  const height = svg.clientHeight;
  // Use fixed physical bounds so A stays still when either motor changes.
  const xmin = -0.22, xmax = 0.87, zmin = -0.18, zmax = 0.80;
  const scale = Math.min((width - 56) / (xmax - xmin), (height - 40) / (zmax - zmin));
  const left = (width - (xmax - xmin) * scale) / 2;
  const top = (height - (zmax - zmin) * scale) / 2;
  // Original CAD view: +x left, +z up.
  const screen = p => [left + (xmax - p[0]) * scale, top + (zmax - p[1]) * scale];
  const line = (p, q, color, thickness = 1.5, dashed = false) => {
    const [x1, y1] = screen(p), [x2, y2] = screen(q);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${thickness}" stroke-linecap="round" ${dashed ? 'stroke-dasharray="5 5"' : ''}/>`;
  };
  const text = (p, label, dx = 0, dy = 0, anchor = 'start') => {
    const [x, y] = screen(p);
    return `<text x="${x + dx}" y="${y + dy}" text-anchor="${anchor}">${label}</text>`;
  };
  const arc = (center, radius, start, end) => {
    if (Math.abs(end - start) < 0.001) return '';
    const points = Array.from({length:65}, (_, i) => screen(add(center, vector(radius, start + (end - start) * i / 64)))).join(' ');
    return `<polyline points="${points}" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#angle-arrow)"/>`;
  };
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.innerHTML = `
    <title id="arm-title">Parallelogram transmission</title>
    <desc id="arm-desc">Shoulder ${s.shoulder} degrees; corrected elbow motor ${s.elbow} degrees; alpha ${s.alpha} degrees; beta ${s.beta} degrees; physical elbow ${s.qe} degrees. Fixed offsets a 270 degrees and k minus 180 degrees.</desc>
    <defs><marker id="angle-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="var(--muted)"/></marker></defs>
    ${line([-.12,0],[.72,0],'var(--border)')}
    ${line(s.D,add(s.D,[.47,0]),'var(--border)',1,true)}
    ${line(s.A,add(s.A,vector(.15,s.alpha)),'var(--muted)',1,true)}
    ${line(s.D,add(s.D,vector(.14,s.alpha)),'var(--muted)',1,true)}
    ${line(s.A,s.D,'var(--upper)',7)}
    ${line(s.B,s.C,'var(--muted)',3)}
    ${line(s.A,s.B,'var(--crank)',9)}
    ${line(s.D,s.C,'var(--crank)',9)}
    ${line(s.D,s.W,'var(--forearm)',7)}
    ${arc(s.A,.14,0,s.alpha)}
    ${arc(s.D,.12,s.alpha,s.beta)}
    ${arc(s.D,.29,0,s.beta)}
    ${[s.A,s.B,s.C,s.D,s.W].map(p => {const [x,y]=screen(p);return `<circle cx="${x}" cy="${y}" r="4" fill="var(--text)"/>`;}).join('')}
    ${text(s.A,'A',-5,22)}${text(s.B,'B',10,5)}${text(s.C,'C',10,3)}${text(s.D,'D',-5,22)}
    ${text(s.W,'Wrist',0,-13,'middle')}
    ${text(add(s.A,vector(.20,s.alpha/2)),`α = ${format(s.alpha)}`,0,-3,'middle')}
    ${text(add(s.D,vector(.20,s.alpha-90)),'k = −180°',0,-5,'middle')}
    ${text(add(s.D,vector(.31,s.beta/2)),`β = ${format(s.beta)}`,0,s.beta>=0?23:-13,'middle')}
    ${text([.65,0],'+x ←',0,22,'middle')}
    ${text(s.A,'Fixed axis',0,44,'middle')}`;
}
function update() {
  const s = state();
  byId('shoulder-value').textContent = format(s.shoulder);
  byId('elbow-value').textContent = format(s.elbow);
  // The reference table is optional, so only fill in the cells that exist.
  for (const key of ['shoulder','elbow','alpha','beta','qe','raw']) {
    const cell = byId(`v-${key}`);
    if (cell) cell.textContent = format(s[key], key === 'raw' ? 2 : 0);
  }
  byId('equations').innerHTML = `
    <div>α = θₑ + a = (${format(s.elbow)}) + 270° = <strong>${format(s.alpha)}</strong></div>
    <div>β = α + k = ${format(s.alpha)} − 180° = <strong>${format(s.beta)}</strong></div>
    <div>C = a + k = 270° − 180° = <strong>${format(C_OFFSET)}</strong></div>
    <div>qₑ = β − qₛ = (${format(s.beta)}) − ${format(s.shoulder)} = <strong>${format(s.qe)}</strong></div>`;
  draw(s);
}
shoulderInput.addEventListener('input',update);
elbowInput.addEventListener('input',update);
byId('home').addEventListener('click',()=>{shoulderInput.value=90;elbowInput.value=-90;update();});
// The parent page tells us when the site theme changes.
window.addEventListener('message', event => {
  if (!event.data || event.data.type !== 'theme') return;
  document.documentElement.setAttribute('data-theme', event.data.theme);
  update();
});
new ResizeObserver(update).observe(svg);
update();
</script>
</body>
</html>
